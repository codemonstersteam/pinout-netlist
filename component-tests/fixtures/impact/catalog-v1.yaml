openapi: 3.0.3
info: {title: catalog, version: "1.0.0"}
paths:
  /items:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku: {type: string}
                  qty: {type: integer}
  /orders:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sku]
              properties:
                sku: {type: string}
      responses:
        "200": {description: ok}
