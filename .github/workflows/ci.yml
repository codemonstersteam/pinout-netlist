name: build & test
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...
  component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./component-tests/scripts/run-tests.sh
  polygon:
    runs-on: ubuntu-latest
    steps:
      # Полигону нужны братские репо (бинари валидаторов собираются из них).
      - uses: actions/checkout@v5
        with: { path: pinout-netlist }
      - uses: actions/checkout@v5
        with: { repository: codemonstersteam/pinout-openapi, path: pinout-openapi }
      - uses: actions/checkout@v5
        with: { repository: codemonstersteam/pinout-asyncapi, path: pinout-asyncapi }
      - working-directory: pinout-netlist
        run: ./component-tests/scripts/run-polygon.sh
